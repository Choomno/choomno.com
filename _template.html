<!DOCTYPE html>
<!-- =============================================================================
     _template.html — copy this file to start a new page.

     1. Duplicate it (e.g. to `notes.html`).
     2. Change the <title> and <meta description>.
     3. Write your content inside <main>.
     4. Link to it from the nav (header.html).

     Everything in <head> and the three placeholder <div>s is the standard page
     shell — leave it alone. This is the "~20 lines" that every page shares; you
     copy it rather than retype it.
     ============================================================================= -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CHANGE ME — one line describing this page.">
    <title>CHANGE ME — Your Name</title>

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/light.css">

    <!-- MathJax: engine settings live in /mathjax-config.js (loaded before the
         library); your LaTeX macros live in macros.html. -->
    <script src="/mathjax-config.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <!-- Shared header/footer/macros + collapsibles. -->
    <script defer src="/includes.js"></script>
    <script defer src="/helpful_stuff.js"></script>
</head>

<body>
<div id="head"></div>
<div id="macros"></div>
<main>

    <h1>Page title</h1>
    <p>Write your content here.</p>

</main>
<div id="foot"></div>
</body>
</html>
